services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wager
      POSTGRES_PASSWORD: wager
      POSTGRES_DB: wager
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wager']
      interval: 3s
      retries: 20

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
    ports: ['4566:4566']
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:4566/_localstack/health']
      interval: 3s
      retries: 30

  setup:
    build: .
    command: sh -c 'bun run migrate && bun run queues'
    environment: &env
      DATABASE_URL: postgresql://wager:wager@postgres:5432/wager
      SQS_ENDPOINT: http://localstack:4566
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_healthy }

  api:
    build: .
    environment: *env
    ports: ['3000-3002:3000']
    depends_on:
      setup: { condition: service_completed_successfully }